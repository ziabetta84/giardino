<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zorba in giardino</title>
    <link rel="icon" type="image/png" href="%BASE_URL%favicon-32x32.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="theme-color" content="#faf7f2" />
    <script>
      // Applica subito il tema salvato (Fase 3 dark mode), prima del bootstrap
      // Vue: evita il lampo chiaro→scuro. Vedi src/composables/useTema.js.
      try {
        var t = localStorage.getItem('giardino_theme') === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        if (t === 'dark') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1c1810');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
